# A2 revision 3: a core convention must be captured with project scope and
# recovered in a fresh session. The former orphan core rule is not pre-seeded.
initiative: pipeline-reports

noise:
  library: ../../noise/project-noise.yaml
  count: 30

nodes:
  - name: weekly-run-log
    type: episode
    tier: operational
    layer: warm
    body: |
      Runs this week: 14 completed, 3 failed on the fetch step, 1 cancelled by
      the operator. Median duration 6m40s; the three failures all hit the same
      upstream timeout.

  - name: reporting-cadence
    type: episode
    tier: operational
    layer: warm
    body: |
      Summaries go out at the end of each week. The operator reads them on
      Monday morning before deciding what to re-run.

edges:
  - from: reporting-cadence
    to: weekly-run-log
    type: refers_to

artifacts:
  - path: project-context.md
    content: |
      Project: pipeline-reports.
      This workspace holds local reports for the pipeline's runs.
