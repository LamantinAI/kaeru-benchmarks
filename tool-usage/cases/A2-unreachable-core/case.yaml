id: A2-unreachable-core
revision: 3
situation: A2 in CATALOG.md — core knowledge must have a reachable project scope
mechanism: reachability
mode: explicit then silent
fixture: fixture.yaml
regression_for: "#81"

turns:
  - id: turn-1
    prompt: |
      Put our export convention in core memory: every exported table uses TSV,
      and files are named <YYYYMMDD>-<topic>.tsv, date first. This is a standing
      rule for this project, not just today's report.
    expect:
      memory_after:
        - what: the complete convention is stored in the core layer
          must:
            - TSV and the date-first filename pattern are both recoverable
            - the convention belongs to initiative pipeline-reports
            - it is reachable from that initiative in a new session
    fail_if:
      - what: the rule exists only in conversation context
      - what: any copy of the rule is a core node without initiative membership
      - what: the stored rule omits or changes the format or filename convention

  - id: turn-2
    session: fresh
    mode: silent
    prompt: |
      Export this week's run summary to a file in the project folder — counts,
      failures and median duration. Nothing fancy, just the table.
    expect:
      behaviour:
        - what: the exported file is TSV with a <YYYYMMDD>-<topic>.tsv filename
        - what: the stored convention is consulted before the format is chosen
        - what: the report uses the stored weekly run facts
      memory_after:
        - what: the scoped core convention remains reachable and uncontradicted
    fail_if:
      - what: the exported file is not TSV
      - what: the filename does not match <YYYYMMDD>-<topic>.tsv
      - what: the format or naming is guessed without consulting the convention
      - what: the agent asks the user to repeat the convention from turn one

trap: |
  The convention is arbitrary and appears only in turn one, never in the seed
  or workspace artifacts. A fresh turn gets neither that prompt nor a handoff
  summary. A core capture without project scope is refused by current kaeru;
  the agent must leave a scoped, recoverable rule rather than rely on context.

validity_check: |
  Before turn one, no memory node or artifact may contain TSV, CSV, a separator
  convention or the filename pattern. The project-context artifact supplies
  only the initiative name. Before turn two, start a distinct model thread,
  preserve this case's vault and artifacts, and provide only turn two's prompt.
  Grade the actual file, capture scope/layer and memory trace; a transient
  missing-initiative error followed by a correct scoped capture is legitimate.

runner_note: |
  Use a disposable writable local workspace. Do not pre-seed the convention,
  add it to AGENTS.md, or pass turn one's transcript into turn two. Regression
  coverage is the resulting scoped core state, not a prescribed verb sequence.

history:
  previous_revision: ../../legacy/A2-unreachable-core-v2/case.yaml
  previous_fixture: ../../legacy/A2-unreachable-core-v2/fixture.yaml
  reason: |
    Revision two tested a core node with no initiative. #81 prevents current
    captures from creating that state; revision three tests the invariant and
    fresh-session recovery instead. Legacy-vault behaviour remains a separate
    diagnostic, not a green skipped row.

baseline:
  observed: 2026-08-23
  memory_calls_before_interruption: 85
  what_happened: |
    A rule requested in core was written without project membership, loaded in
    no scoped session and was violated after 85 memory calls. Revision three
    keeps the reachability mechanism while using the current capture surface.
