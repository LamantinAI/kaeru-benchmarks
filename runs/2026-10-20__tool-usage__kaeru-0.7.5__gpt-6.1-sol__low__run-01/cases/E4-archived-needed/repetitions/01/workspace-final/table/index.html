<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table numeric styling</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <table>
      <caption>Example metrics</caption>
      <thead>
        <tr><th scope="col">Metric</th><th scope="col" class="numeric">Value</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">Metric A</th><td class="numeric">1,111.00</td></tr>
        <tr><th scope="row">Metric B</th><td class="numeric">888.88</td></tr>
        <tr><th scope="row">Metric C</th><td class="numeric">12.50</td></tr>
      </tbody>
    </table>
  </body>
</html>
